<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peekr</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <nav>
            <div class="logo">
                <img src="logo.png" alt="logo">
                <a href="#">Peekr</a>
            </div>


            <div class="auth">
                <button id="loginB">Login</button>
                <div class="profile" id="profileC" hidden>
                    <img id="profile" src="" alt="user-avatar">
                    <div class="profile-panel" id="profilePanel" hidden>
                        <button id="logoutB">Logout</button>
                    </div>
                </div>

            </div>
        </nav>
    </header>

    <section>
        <div class="main">
            <h1 id="peekrtitle">Peekr</h1>
        </div>
    </section>
</body>

</html>
